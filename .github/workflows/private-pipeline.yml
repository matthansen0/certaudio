name: Private Content Pipeline

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      certificationId:
        required: true
        type: string
      audioFormat:
        required: true
        type: string
      instructionalVoice:
        required: true
        type: string
      podcastHostVoice:
        required: true
        type: string
      podcastExpertVoice:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_RESOURCE_GROUP:
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: certaudio-private-content-pipeline
  cancel-in-progress: false

env:
  PIPELINE_WEBJOB_NAME: certaudio-pipeline-v2
  SEARCH_NAME: certaudio-search-ephemeral
  SEARCH_LOCATION: centralus
  SEARCH_ENDPOINT: https://certaudio-search-ephemeral.search.windows.net

jobs:
  run-pipeline:
    name: Build and Run Private Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Validate configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          for value in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [[ -z "${!value:-}" ]]; then
              echo "::error::Missing required secret: $value"
              exit 1
            fi
          done
          if [[ "${{ inputs.mode }}" != "generate" && "${{ inputs.mode }}" != "refresh" ]]; then
            echo "::error::Unsupported pipeline mode: ${{ inputs.mode }}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/pipeline/requirements-webjob.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve private pipeline resources
        run: |
          set -euo pipefail
          pipeline_app_name=$(az webapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.purpose=='private-content-pipeline'].name | [0]" \
            --output tsv)
          if [[ -z "$pipeline_app_name" ]]; then
            pipeline_app_name=$(az webapp list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?starts_with(name, 'certaudio-dev-pipeline-')].name | [0]" \
              --output tsv)
          fi
          if [[ -z "$pipeline_app_name" ]]; then
            echo "::error::Private pipeline infrastructure is not deployed."
            exit 1
          fi

          pipeline_principal_id=$(az identity show \
            --name certaudio-dev-pipeline-mi \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query principalId \
            --output tsv)
          echo "PIPELINE_APP_NAME=$pipeline_app_name" >> "$GITHUB_ENV"
          echo "PIPELINE_PRINCIPAL_ID=$pipeline_principal_id" >> "$GITHUB_ENV"

      - name: Package and deploy pipeline WebJob
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/certaudio-pipeline-webjob.zip"
          job_package_path="$RUNNER_TEMP/certaudio-pipeline-job.zip"
          bash scripts/package-pipeline-webjob.sh "$package_path" "$job_package_path"
          az webapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PIPELINE_APP_NAME" \
            --src "$package_path" \
            --timeout 1800 \
            --only-show-errors \
            --output none

          scm_host=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PIPELINE_APP_NAME" \
            --query 'enabledHostNames[?contains(@, `.scm.`)] | [0]' \
            --output tsv)
          access_token=$(az account get-access-token \
            --resource https://management.azure.com \
            --query accessToken \
            --output tsv)
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/zip' \
            --header 'Content-Disposition: attachment; filename=certaudio-pipeline-v2.zip' \
            --data-binary "@$job_package_path" \
            "https://${scm_host}/api/triggeredwebjobs/${PIPELINE_WEBJOB_NAME}"

      - name: Deploy ephemeral AI Search
        run: |
          set -euo pipefail
          state=$(az search service show \
            --name "$SEARCH_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query provisioningState \
            --output tsv 2>/dev/null || true)
          if [[ "${state,,}" == "failed" ]]; then
            az search service delete \
              --name "$SEARCH_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --yes \
              --only-show-errors
          fi

          az deployment group create \
            --name "search-ephemeral-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/modules/search-ephemeral.bicep \
            --parameters \
              searchName="$SEARCH_NAME" \
              location="$SEARCH_LOCATION" \
              automationPrincipalId="$PIPELINE_PRINCIPAL_ID" \
            --only-show-errors \
            --output none

          sleep 30

      - name: Preserve live Study Partner indexing
        run: |
          set -euo pipefail
          persistent_name=$(az search service list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?starts_with(name, 'certaudio-dev-search-')].name | [0]" \
            --output tsv)
          if [[ -z "$persistent_name" ]]; then
            exit 0
          fi

          persistent_id=$(az search service show \
            --name "$persistent_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv)
          for role in "Search Index Data Contributor" "Search Service Contributor"; do
            existing=$(az role assignment list \
              --assignee "$PIPELINE_PRINCIPAL_ID" \
              --scope "$persistent_id" \
              --query "[?roleDefinitionName=='$role'] | length(@)" \
              --output tsv)
            if [[ "$existing" == "0" ]]; then
              az role assignment create \
                --assignee-object-id "$PIPELINE_PRINCIPAL_ID" \
                --assignee-principal-type ServicePrincipal \
                --role "$role" \
                --scope "$persistent_id" \
                --only-show-errors \
                --output none
            fi
          done
          echo "PERSISTENT_SEARCH_ENDPOINT=https://${persistent_name}.search.windows.net" >> "$GITHUB_ENV"

      - name: Run private content pipeline
        env:
          MAX_POLLS: 660
        run: |
          set -euo pipefail
          config_version="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PIPELINE_APP_NAME" \
            --settings \
              PIPELINE_MODE="${{ inputs.mode }}" \
              CERTIFICATION_ID="${{ inputs.certificationId }}" \
              AUDIO_FORMAT="${{ inputs.audioFormat }}" \
              INSTRUCTIONAL_VOICE="${{ inputs.instructionalVoice }}" \
              PODCAST_HOST_VOICE="${{ inputs.podcastHostVoice }}" \
              PODCAST_EXPERT_VOICE="${{ inputs.podcastExpertVoice }}" \
              PIPELINE_FORCE="${{ inputs.force }}" \
              PIPELINE_CONFIG_VERSION="$config_version" \
            --only-show-errors \
            --output none

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PIPELINE_APP_NAME" \
            --only-show-errors

          hostname=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PIPELINE_APP_NAME" \
            --query defaultHostName \
            --output tsv)
          for attempt in {1..30}; do
            health=$(curl -sS "https://$hostname" || true)
            if [[ "$(jq -r '.configVersion // empty' <<<"$health" 2>/dev/null)" == "$config_version" ]]; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "::error::Pipeline WebJob host did not load configuration $config_version."
              exit 1
            fi
            sleep 10
          done

          bash scripts/run-pipeline-webjob.sh

      - name: Write summary
        if: success()
        run: |
          {
            echo "## Content pipeline complete"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Mode | ${{ inputs.mode }} |"
            echo "| Certification | ${{ inputs.certificationId }} |"
            echo "| Format | ${{ inputs.audioFormat }} |"
            echo "| Execution | Central US triggered WebJob |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-search:
    name: Delete Ephemeral AI Search
    needs: run-pipeline
    if: always()
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete ephemeral Search
        run: |
          set -euo pipefail
          if az search service show \
            --name "$SEARCH_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none 2>/dev/null; then
            az search service delete \
              --name "$SEARCH_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --yes \
              --only-show-errors
          fi
          echo "Ephemeral AI Search cleanup complete." >> "$GITHUB_STEP_SUMMARY"